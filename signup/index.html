<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Your Account — Tenant Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0b2c3d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0}.card{background:#fff;border-radius:14px;padding:40px;width:100%;max-width:440px}img{display:block;height:44px;margin:0 auto 26px}h1{text-align:center;color:#0b2c3d;font-size:22px}.property{background:#E8EEED;color:#0b2c3d;padding:12px;border-radius:8px;text-align:center;font-weight:700;margin:14px 0 24px}label{display:block;color:#0b2c3d;font-size:13px;font-weight:700;margin:0 0 6px}input{width:100%;padding:12px 14px;border:1.5px solid #dde3e3;border-radius:8px;font-size:15px;margin-bottom:18px}button{width:100%;padding:14px;background:#C4775A;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700}.error{display:none;background:#fff2f0;border:1px solid #f5c0b5;color:#b83c28;padding:11px;border-radius:8px;margin-bottom:16px}.center{text-align:center;color:#666;line-height:1.6}.link{text-align:center;margin-top:20px}.link a{color:#C4775A;font-weight:700}</style></head><body><div class="card"><img src="https://assets.cdn.filesafe.space/Ju2En80bdsSebpKgHpJT/media/f5959204-7bf4-415e-a80a-cc75312b2ddb.png" alt="I Rent Houses In Sweats" onerror="this.style.display='none'"><div id="loading" class="center">Looking up your property…</div><div id="form" style="display:none"><h1>Create Your Account</h1><div id="address" class="property"></div><div id="error" class="error"></div><label>Email Address</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><label>Confirm Password</label><input id="confirm" type="password" autocomplete="new-password"><button id="submit" type="button">Create Account</button><div class="link">Already have an account? <a href="/login">Sign in</a></div></div><div id="message" class="center" style="display:none"></div></div><script>const {createClient}=supabase;const db=createClient('https://dzhdwremvptmtacvmxlq.supabase.co','sb_publishable_o1_z3RyBQlz5KRpMPSF83A_ux7nAc2y');let propertyId=null;const form=document.getElementById('form'),loading=document.getElementById('loading'),message=document.getElementById('message'),errorEl=document.getElementById('error');function msg(t){loading.style.display='none';form.style.display='none';message.textContent=t;message.style.display='block'}function err(t){errorEl.textContent=t;errorEl.style.display='block'}async function init(){const {data:{session}}=await db.auth.getSession();if(session){location.replace('/dashboard');return}const code=new URLSearchParams(location.search).get('p');if(!code){msg('This invite link is invalid or expired. Please contact Neela for a new link.');return}try{const {data:p,error}=await db.from('properties').select('id,address').eq('invite_code',code).single();if(error||!p){msg('This invite link is invalid or expired. Please contact Neela for a new link.');return}propertyId=p.id;const {data:claimed,error:claimError}=await db.rpc('property_has_tenant',{target_property_id:propertyId});if(claimError){msg('We could not verify this invite right now. Please try again later.');return}if(claimed){msg('An account already exists for this property. Please sign in or contact Neela if this is unexpected.');return}document.getElementById('address').textContent=p.address;loading.style.display='none';form.style.display='block'}catch(e){msg('We could not load your property details. Please try again later.')}}async function signup(){errorEl.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,btn=document.getElementById('submit');if(!email||!password||!confirm){err('Please fill in all fields.');return}if(password.length<8){err('Password must be at least 8 characters.');return}if(password!==confirm){err('Passwords do not match.');return}btn.disabled=true;btn.textContent='Creating account…';const {data,error}=await db.auth.signUp({email,password});if(error||!data.user){err(error?.message||'We could not create your account.');btn.disabled=false;btn.textContent='Create Account';return}const {error:insertError}=await db.from('tenants').insert({user_id:data.user.id,property_id:propertyId,balance:0,email});if(insertError){if(insertError.code==='23505'){msg('An account already exists for this property. Please sign in or contact Neela.');return}err('Your login was created, but we could not link it to your property. Please contact Neela.');btn.disabled=false;btn.textContent='Create Account';return}if(data.session){location.replace('/dashboard')}else{msg('Your account was created. Check your email to confirm your address, then return here to sign in.')}}document.getElementById('submit').addEventListener('click',signup);init();</script></body></html>
