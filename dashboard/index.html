<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Tenant Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eceae6;color:#0b2c3d}.top{background:#0b2c3d;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.top img{height:34px}.top button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:7px;padding:7px 12px}.main{max-width:760px;margin:32px auto;padding:0 20px}.card{background:#fff;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px #0b2c3d12}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#C4775A;font-weight:700}.value{font-size:28px;font-weight:700;margin-top:6px}.sub{color:#6b7280;font-size:13px;margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions a{background:#C4775A;color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:700}.actions a.secondary{background:#0b2c3d}.error{background:#fff2f0;color:#b83c28;border:1px solid #f5c0b5;padding:14px;border-radius:8px}.status{padding:12px;border-radius:8px;background:#eef5f3;margin-bottom:16px}.loading{text-align:center;padding:60px;color:#6b7280}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><img src="https://assets.cdn.filesafe.space/Ju2En80bdsSebpKgHpJT/media/f893b497-0694-485f-8d2a-efccfe5349bd.png" alt="I Rent Houses In Sweats" onerror="this.style.display='none'"><button id="signout">Sign Out</button></div><main class="main"><div id="loading" class="loading">Loading your account…</div><div id="error" class="error" style="display:none"></div><div id="dashboard" style="display:none"><h1 id="address"></h1><p id="email" class="sub"></p><div id="inactive" class="status" style="display:none">This tenant account is currently inactive. Contact Neela if you believe this is incorrect.</div><div class="grid"><div class="card"><div class="label">Monthly Rent</div><div id="rent" class="value">—</div><div class="sub">Supabase property rent</div></div><div class="card"><div class="label">Account Balance</div><div id="balance" class="value">—</div><div id="balanceNote" class="sub"></div></div></div><div class="card"><div class="label">Account</div><div id="active" class="value" style="font-size:20px"></div><div class="actions"><a href="/pay-rent">Make a Payment</a><a class="secondary" href="/documents">Documents</a><a class="secondary" href="/history">History</a><a class="secondary" href="/maintenance">Maintenance</a><a class="secondary" href="/settings">Settings</a></div></div></div></main><script>const {createClient}=supabase;const db=createClient('https://dzhdwremvptmtacvmxlq.supabase.co','sb_publishable_o1_z3RyBQlz5KRpMPSF83A_ux7nAc2y');const fmt=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});async function init(){try{const {data:{session}}=await db.auth.getSession();if(!session){location.replace('/login');return}const {data:t,error:te}=await db.from('tenants').select('property_id,balance,email,is_active').eq('user_id',session.user.id).single();if(te||!t){await db.auth.signOut();location.replace('/login');return}const {data:p,error:pe}=await db.from('properties').select('address,monthly_rent').eq('id',t.property_id).single();if(pe||!p)throw pe||new Error('Property not found');document.getElementById('address').textContent=p.address;document.getElementById('email').textContent=t.email||session.user.email||'';document.getElementById('rent').textContent=fmt(p.monthly_rent);const balance=Number(t.balance||0);document.getElementById('balance').textContent=fmt(Math.abs(balance));document.getElementById('balanceNote').textContent=balance>0?'outstanding balance':balance<0?'credit on account':'no balance due';document.getElementById('active').textContent=t.is_active?'Active tenant account':'Inactive tenant account';if(!t.is_active)document.getElementById('inactive').style.display='block';document.getElementById('loading').style.display='none';document.getElementById('dashboard').style.display='block'}catch(e){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.textContent='We could not load your account. Please try again.';el.style.display='block'}}document.getElementById('signout').onclick=async()=>{await db.auth.signOut();location.replace('/login')};init();</script></body></html>
