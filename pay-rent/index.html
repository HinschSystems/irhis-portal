<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Rent — Tenant Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eceae6;color:#0b2c3d}.top{background:#0b2c3d;color:#fff;padding:14px 24px}.top a{color:#fff;text-decoration:none}.main{max-width:600px;margin:32px auto;padding:0 20px}.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px}.label{font-size:12px;color:#C4775A;text-transform:uppercase;font-weight:700}.value{font-size:28px;font-weight:700;margin:6px 0}.sub{color:#6b7280;font-size:14px}.pay{background:#0b2c3d;color:#fff}.pay input{width:100%;font-size:24px;padding:14px;border:0;border-radius:8px;margin:12px 0}.pay button{width:100%;background:#C4775A;color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:700}.pay button:disabled{opacity:.55}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.quick button{width:auto;background:#ffffff18;border:1px solid #ffffff44;padding:8px 12px}.error{display:none;background:#fff2f0;color:#b83c28;border:1px solid #f5c0b5;padding:12px;border-radius:8px;margin-bottom:12px}</style></head><body><div class="top"><a href="/dashboard">← Dashboard</a></div><main class="main"><div id="loading" class="card">Loading your account…</div><div id="content" style="display:none"><div class="card"><div class="label">Property</div><div id="address" class="value" style="font-size:22px"></div><div class="label" style="margin-top:18px">Monthly Rent</div><div id="rent" class="value"></div><div class="label" style="margin-top:18px">Current Balance</div><div id="balance" class="value"></div><div id="balanceNote" class="sub"></div></div><div class="error" id="error"></div><div class="card pay"><div class="label">Make a Payment</div><input id="amount" type="number" min="1" step="0.01" placeholder="0.00"><div id="quick" class="quick"></div><button id="pay">Continue to Secure Checkout</button><p class="sub" style="color:#ffffff99;text-align:center">You will be redirected to Stripe Checkout.</p></div></div></main><script>const {createClient}=supabase;const db=createClient('https://dzhdwremvptmtacvmxlq.supabase.co','sb_publishable_o1_z3RyBQlz5KRpMPSF83A_ux7nAc2y');let monthlyRent=0,tenantEmail='',propertyAddress='';const fmt=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});function fail(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('/login');return}const {data:t,error:te}=await db.from('tenants').select('property_id,balance,email,is_active').eq('user_id',session.user.id).single();if(te||!t){await db.auth.signOut();location.replace('/login');return}if(!t.is_active){document.getElementById('loading').textContent='This tenant account is inactive. Contact Neela before making a payment.';return}const {data:p,error:pe}=await db.from('properties').select('address,monthly_rent').eq('id',t.property_id).single();if(pe||!p){document.getElementById('loading').textContent='We could not load this property.';return}monthlyRent=Number(p.monthly_rent||0);tenantEmail=t.email||session.user.email||'';propertyAddress=p.address||'';document.getElementById('address').textContent=propertyAddress;document.getElementById('rent').textContent=fmt(monthlyRent);const b=Number(t.balance||0);document.getElementById('balance').textContent=fmt(Math.abs(b));document.getElementById('balanceNote').textContent=b>0?'outstanding balance':b<0?'credit on account':'no balance due';[['Full Month',monthlyRent],['Half Month',monthlyRent/2],['$100',100],['$50',50]].forEach(([label,value])=>{const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.onclick=()=>document.getElementById('amount').value=Number(value).toFixed(2);document.getElementById('quick').appendChild(btn)});document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block'}async function pay(){const amount=Number(document.getElementById('amount').value),btn=document.getElementById('pay');document.getElementById('error').style.display='none';if(!Number.isFinite(amount)||amount<1){fail('Enter a payment amount of at least $1.00.');return}btn.disabled=true;btn.textContent='Opening checkout…';try{const r=await fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,email:tenantEmail,address:propertyAddress})});const data=await r.json();if(!r.ok||!data.url)throw new Error(data.error||'Checkout failed');location.href=data.url}catch(e){fail('We could not open secure checkout. Please try again.');btn.disabled=false;btn.textContent='Continue to Secure Checkout'}}document.getElementById('pay').onclick=pay;init();</script></body></html>
