<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — Tenant Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0b2c3d;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0}.card{background:#fff;border-radius:14px;padding:40px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.25)}img{display:block;height:44px;margin:0 auto 28px}h1{text-align:center;color:#0b2c3d;font-size:22px;margin:0 0 28px}label{display:block;color:#0b2c3d;font-size:13px;font-weight:700;margin:0 0 6px}input{width:100%;padding:12px 14px;border:1.5px solid #dde3e3;border-radius:8px;font-size:15px;margin-bottom:18px}button{width:100%;padding:14px;background:#C4775A;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.error{display:none;background:#fff2f0;border:1px solid #f5c0b5;color:#b83c28;padding:11px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}.note{text-align:center;color:#777;font-size:14px;margin-top:22px}</style></head><body><div class="card"><img src="https://assets.cdn.filesafe.space/Ju2En80bdsSebpKgHpJT/media/f5959204-7bf4-415e-a80a-cc75312b2ddb.png" alt="I Rent Houses In Sweats" onerror="this.style.display='none'"><h1>Sign In</h1><div class="error" id="error"></div><label for="email">Email Address</label><input id="email" type="email" autocomplete="email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button id="submit" type="button">Sign In</button><div class="note">Need an account? Use the invite link provided for your property.</div></div><script>const {createClient}=supabase;const db=createClient('https://dzhdwremvptmtacvmxlq.supabase.co','sb_publishable_o1_z3RyBQlz5KRpMPSF83A_ux7nAc2y');const errorEl=document.getElementById('error');function showError(m){errorEl.textContent=m;errorEl.style.display='block'}db.auth.getSession().then(({data:{session}})=>{if(session)location.replace('/dashboard')});async function login(){errorEl.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,btn=document.getElementById('submit');if(!email||!password){showError('Please enter your email and password.');return}btn.disabled=true;btn.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password});if(error){showError('Invalid email or password. Please try again.');btn.disabled=false;btn.textContent='Sign In';return}location.replace('/dashboard')}document.getElementById('submit').addEventListener('click',login);document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
